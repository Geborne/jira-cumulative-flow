<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cumulative Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one 1080px column. Header, one filter row, then a single wide chart panel
     with its legend on top and the numbers table underneath. Same warm-dark look as the sprint dashboards. */
  :root{
    color-scheme: dark;
    --bg:#1b1512; --panel:#241d18; --panel-2:#2b231d; --border:#3a2f27; --grid:#30271f;
    --text:#f1e7d9; --muted:#a8998a; --muted-2:#7d7064; --gold:#d4a24c;
    --s-done:#754726; --s-scrapped:#945831; --s-progress:#d26c28;
    --s-blocked:#e58c40; --s-todo:#ecb073; --s-backlog:#efd3ac;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'DM Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); font-size:14px; line-height:1.5;
    padding-inline:20px; padding-block:20px 56px;
  }
  .wrap{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:22px;}
  header{
    padding:34px 0 22px; border-bottom:1px solid var(--border);
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px;
  }
  h1{font-family:var(--font-display); font-size:30px; font-weight:600; margin:0; line-height:1.15; text-wrap:balance;}
  .sub{color:var(--muted); font-size:13px; margin-top:6px;}
  .source{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; font-size:12px; color:var(--muted);}
  .badge{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
    padding:4px 11px; border-radius:999px; border:1px solid var(--border); color:var(--muted);
  }
  .badge.live{background:var(--gold); border-color:var(--gold); color:#1b1512; font-weight:500;}
  .linkbtn{
    font:inherit; font-size:12px; color:var(--gold); background:transparent;
    border:1px solid var(--border); border-radius:8px; padding:4px 10px; cursor:pointer;
  }
  .linkbtn:hover{background:var(--panel-2);}
  .notice{font-size:12px; color:var(--muted); margin:-8px 0 0;}

  .controls{display:flex; flex-wrap:wrap; align-items:center; gap:10px 24px;}
  .group{display:flex; align-items:center; gap:10px;}
  .group-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .seg button{
    font:inherit; font-size:12px; background:transparent; color:var(--muted);
    border:0; padding:7px 13px; cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--border);}
  .seg button:hover{color:var(--text);}
  .seg button[aria-pressed="true"]{background:var(--panel-2); color:var(--text);}
  button:focus-visible, summary:focus-visible, svg:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px 18px 14px; min-width:0;}
  .legend{display:flex; flex-wrap:wrap; gap:8px 22px; font-size:12.5px; color:var(--muted); margin-bottom:12px;}
  .legend .item{display:inline-flex; align-items:center; gap:7px; white-space:nowrap;}
  .legend .sw{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .legend b{color:var(--text); font-weight:500;}
  .legend .total{margin-left:auto;}

  .chart{position:relative;}
  .chart svg{display:block; width:100%; touch-action:pan-y; cursor:crosshair;}
  .chart text{font-family:var(--font-body); font-size:10.5px; fill:var(--muted);}
  .chart text.end{fill:var(--text); font-size:11.5px;}
  .tip{
    position:absolute; top:0; left:0; pointer-events:none; z-index:2;
    background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; font-size:12px; min-width:172px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .tip .when{color:var(--muted); margin-bottom:7px; white-space:nowrap;}
  .tip .row{display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:8px; line-height:1.7;}
  .tip .key{display:block; height:2px; width:14px; border-radius:1px;}
  .tip .name{color:var(--muted);}
  .tip .val{color:var(--text); font-weight:500; font-variant-numeric:tabular-nums;}
  .tip .sum{border-top:1px solid var(--border); margin-top:6px; padding-top:5px;}

  .footnote{
    margin-top:12px; padding-top:11px; border-top:1px dashed var(--border);
    color:var(--muted); font-size:12px; line-height:1.6;
  }
  .footnote span{display:block; max-width:78ch;}
  details{margin-top:14px;}
  summary{cursor:pointer; color:var(--gold); font-size:12.5px; width:max-content; max-width:100%;}
  .table-scroll{overflow:auto; max-height:360px; margin-top:12px; border:1px solid var(--border); border-radius:8px;}
  table{width:100%; min-width:620px; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums;}
  th{
    position:sticky; top:0; background:var(--panel-2); text-align:right; padding:8px 12px;
    color:var(--muted); text-transform:uppercase; font-size:10.5px; letter-spacing:.05em; font-weight:500;
    border-bottom:1px solid var(--border);
  }
  td{padding:7px 12px; border-bottom:1px solid var(--border); text-align:right;}
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2){text-align:left;}
  td:nth-child(2){color:var(--muted);}
  tr:last-child td{border-bottom:0;}

  @media (max-width:560px){
    h1{font-size:25px;}
    .panel{padding:14px 12px 12px;}
    .legend .total{margin-left:0;}
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="notice" id="notice" role="status" hidden></p>

  <div class="controls">
    <div class="group">
      <span class="group-label" id="lbl-range">Range</span>
      <div class="seg" role="group" aria-labelledby="lbl-range">
        <button type="button" id="range-all" data-range="all" aria-pressed="true">All</button>
        <button type="button" id="range-90" data-range="90" aria-pressed="false">90 days</button>
        <button type="button" id="range-30" data-range="30" aria-pressed="false">30 days</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label" id="lbl-detail">Detail</span>
      <div class="seg" role="group" aria-labelledby="lbl-detail">
        <button type="button" id="detail-week" data-detail="week" aria-pressed="true">Weekly</button>
        <button type="button" id="detail-day" data-detail="day" aria-pressed="false">Daily</button>
      </div>
    </div>
  </div>

  <section class="panel">
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart">
      <svg id="svg" tabindex="0" role="img" aria-label="Stacked area chart of issues per status over time. Use the left and right arrow keys to read each point; the same numbers are in the table below."></svg>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="footnote" id="footnote"></div>
    <details id="numbers">
      <summary>Show the numbers</summary>
      <div class="table-scroll"><table id="table"></table></div>
    </details>
  </section>
</div>

    STATUSES.forEach(function (s, k) {
      c += p.v[k];
      if (!geo.used[k] || !p.v[k]) return;
      el('circle', { cx: x, cy: geo.Y(c), r: 4, fill: s.color, stroke: 'var(--panel)', 'stroke-width': 2 }, layer);
    });

    tip.textContent = '';
    h('div', 'when', (state.detail === 'week' ? 'Week ending ' : '') + fmt(p.t, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' + sprintLabel(p.t), tip);
    for (var k = STATUSES.length - 1; k >= 0; k--) {       // top band first, matching the picture
      if (!geo.used[k]) continue;
      var row = h('div', 'row', null, tip);
      var key = h('span', 'key', null, row); key.style.background = STATUSES[k].color;
      h('span', 'name', STATUSES[k].label, row);
      h('span', 'val', String(p.v[k]), row);
    }
    var sum = h('div', 'row sum', null, tip);
    h('span', null, '', sum); h('span', 'name', 'Total', sum); h('span', 'val', String(p.total), sum);
    tip.hidden = false;
    var scale = chartBox.clientWidth / geo.W, px = x * scale, tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = px + 14;
    if (left + tw > chartBox.clientWidth) left = px - 14 - tw;
    if (left < 0) left = Math.max(0, Math.min(chartBox.clientWidth - tw, px - tw / 2));
    tip.style.left = left + 'px';
    tip.style.top = Math.max(0, Math.min(geo.M.t + 4, geo.H - th)) + 'px';
  }
  function hideTip() { tip.hidden = true; if (geo) geo.layer.textContent = ''; }
  function nearest(clientX) {
    var rect = svg.getBoundingClientRect(), x = (clientX - rect.left) * (geo.W / rect.width), best = 0, bd = Infinity;
    geo.pts.forEach(function (p, i) { var dd = Math.abs(geo.X(p.t) - x); if (dd < bd) { bd = dd; best = i; } });
    return best;
  }
  svg.addEventListener('pointermove', function (e) { if (geo) showHover(nearest(e.clientX)); });
  svg.addEventListener('pointerdown', function (e) { if (geo) showHover(nearest(e.clientX)); });
  svg.addEventListener('pointerleave', function () { state.hover = -1; hideTip(); });
  svg.addEventListener('blur', function () { state.hover = -1; hideTip(); });
  svg.addEventListener('keydown', function (e) {
    if (!geo) return;
    var n = geo.pts.length, i = state.hover < 0 ? n - 1 : state.hover;
    if (e.key === 'ArrowLeft') i = Math.max(0, state.hover < 0 ? n - 1 : i - 1);
    else if (e.key === 'ArrowRight') i = Math.min(n - 1, state.hover < 0 ? n - 1 : i + 1);
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = n - 1;
    else if (e.key === 'Escape') { state.hover = -1; hideTip(); return; }
    else return;
    e.preventDefault(); showHover(i);
  });

  function renderTable(pts, used) {
    var table = $('table'); table.textContent = '';
    var thead = h('thead', null, null, table), hr = h('tr', null, null, thead);
    h('th', null, state.detail === 'week' ? 'Week ending' : 'Day', hr);
    h('th', null, 'Sprint', hr);
    var cols = []; for (var c = STATUSES.length - 1; c >= 0; c--) if (used[c]) cols.push(c);
    cols.forEach(function (k) { h('th', null, STATUSES[k].label, hr); });
    h('th', null, 'Total', hr);
    var tbody = h('tbody', null, null, table);
    for (var i = pts.length - 1; i >= 0; i--) {
      var p = pts[i], tr = h('tr', null, null, tbody);
      h('td', null, fmt(p.t, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }), tr);
      h('td', null, sprintLabel(p.t), tr);
      cols.forEach(function (k) { h('td', null, String(p.v[k]), tr); });
      h('td', null, String(p.total), tr);
    }
  }

  function renderFootnote(days) {
    var note = state.detail === 'week'
      ? 'Weekly shows the count at the end of each week (Saturday, or the latest day for the current week), joined by a smooth curve. '
      : 'Daily shows the count at the end of each day. ';
    note += 'Days up to 1 Oct 2026 were rebuilt from Notion’s transition timestamps, so the To Do and In Progress bands before that date are approximate. Later days are exact end-of-day counts.';
    var fn = $('footnote'); fn.textContent = ''; h('span', null, note, fn);
  }

  // controls
  document.querySelectorAll('[data-range]').forEach(function (b) {
    b.addEventListener('click', function () { state.range = b.dataset.range; state.hover = -1; try { localStorage.setItem('cfd-range', state.range); } catch (e) {} render(); });
  });
  document.querySelectorAll('[data-detail]').forEach(function (b) {
    b.addEventListener('click', function () { state.detail = b.dataset.detail; state.hover = -1; try { localStorage.setItem('cfd-detail', state.detail); } catch (e) {} render(); });
  });
  var lastW = 0;
  if (window.ResizeObserver) new ResizeObserver(function () {
    var w = Math.floor(chartBox.clientWidth);
    if (w && Math.abs(w - lastW) > 1) { lastW = w; render(); }
  }).observe(chartBox);

  // ---- data.json sits next to this page and is rewritten every night (falls back to the copy saved in the page) ----
  var badge = $('badge'), notice = $('notice'), refresh = $('refresh');
  function setBadge(text, live) { if (!badge) return; badge.textContent = text; badge.className = live ? 'badge live' : 'badge'; }
  function say(text) { notice.textContent = text || ''; notice.hidden = !text; }
  var savedDay = savedData.length ? fmt(savedData[savedData.length - 1].t, { day: 'numeric', month: 'short', year: 'numeric' }) : '';

  function load(manual) {
    if (manual) say('Checking for newer numbers…');
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (j) {
        var parsed = parsePacked(j && j.packed);
        if (!parsed.length) throw new Error('empty');
        state.data = parsed;
        setBadge('Updated nightly', true);
        say('');
        render();
      })
      .catch(function () {
        if (state.data === savedData) {
          setBadge('Saved copy', false);
          say('Couldn’t load the latest numbers. Showing the copy saved on ' + savedDay + '.');
        } else {
          say('Couldn’t check for newer numbers just now. Keeping the ones already shown.');
        }
      });
  }
  function startLive() {
    if (!window.fetch) return;
    if (refresh) { refresh.hidden = false; refresh.addEventListener('click', function () { load(true); }); }
    load(false);
    // A Notion embed can stay open for days: look again every hour and whenever the tab comes back.
    setInterval(function () { load(false); }, 3600000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) load(false); });
  }

  render();
  startLive();
})();
</script>

</body>
</html>
